<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#244d40"><title>Lesson Presenter · Phone remote</title></head>
<body class="phone-remote"><header><a id="remotePresenter">Presenter dashboard ↗</a><h1>Presentation remote</h1><p id="remoteStatus" role="status">Connecting…</p><button id="remoteSignIn" hidden>Sign in with Google</button></header>
<main><section class="remote-pointer"><div class="remote-mode" role="group" aria-label="Remote pointer mode"><button data-mode="touch" aria-pressed="true">Touch laser</button><button data-mode="motion" aria-pressed="false">Motion laser</button><button data-mode="draw" aria-pressed="false">Draw</button></div><p id="remoteHint">Hold and move your finger over the slide to point.</p><div id="remotePad" tabindex="0" role="application" aria-label="Slide laser pad. Drag to point; use arrow keys and Space with a keyboard."><iframe id="remotePreview" title="Current slide underneath the laser pad" tabindex="-1" aria-hidden="true"></iframe><canvas id="remoteDrawingCanvas" aria-label="Editable live drawings"></canvas><span id="remoteDot" aria-hidden="true"></span></div><div class="remote-current-caption"><span>Current slide</span><span id="remoteSlide"></span></div><div class="remote-motion-controls" hidden><button id="remoteCalibrate">Calibrate center</button><button id="remoteMotionHold" aria-pressed="false">Hold to point</button></div>
<section class="remote-drawing-controls" hidden aria-label="Drawing controls"><div class="remote-draw-tools" role="toolbar" aria-label="Drawing tools"><button data-draw-tool="select" aria-pressed="false">Select</button><button data-draw-tool="pen" aria-pressed="true">Pen</button><button data-draw-tool="square" aria-pressed="false">Square</button><button data-draw-tool="circle" aria-pressed="false">Circle</button><button data-draw-tool="arrow" aria-pressed="false">Arrow</button></div><div class="remote-mark-style"><label>Color<input id="remoteColor" type="color" value="#e11d48"></label><label>Line width<input id="remoteWidth" type="range" min="2" max="20" value="4"></label><button id="remoteDeleteMark" disabled>Delete selected</button></div><label class="remote-mark-picker">Select a drawing<select id="remoteMarkPicker"><option value="">Tap a mark on the slide</option></select></label><div id="remoteSelectionControls" hidden><span id="remoteSelectionName"></span><label>Size <span id="remoteMarkSizeValue">100%</span><input id="remoteMarkSize" type="range" min="25" max="300" step="5" value="100"></label></div><p>Drag a mark to move it. Drag a corner to resize, or use Size.</p><button data-action="clear" class="remote-clear-marks">Clear all live marks</button></section></section>
<div class="remote-navigation"><button data-action="previous" aria-label="Previous slide or hide answer">← Previous</button><button data-action="next" id="remoteNext" class="remote-next" disabled aria-label="Next presentation step"><span class="remote-next-heading"><span id="remoteNextKind">Next</span><span aria-hidden="true">→</span></span><span class="remote-next-image"><canvas id="remoteNextCanvas" width="480" height="270" aria-hidden="true"></canvas><span id="remoteNextEmpty">Waiting for presentation</span></span><span id="remoteNextTitle" class="remote-next-title"></span></button></div>
<div class="remote-secondary"><button data-action="blank" aria-pressed="false">Blank screen</button><button data-action="restart">Replay effects</button></div><p class="remote-help" id="remoteMotionHelp" hidden>Calibrate while holding your phone comfortably, then hold to point and tilt it.</p></main><script type="module" src="/remote.js"></script></body></html>
